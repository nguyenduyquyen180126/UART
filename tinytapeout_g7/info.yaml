project:
  title: "HUST APB UART"
  author: "Vu Hoang Viet Anh"
  description: "SPI-controlled APB UART with interrupt and modem flow control."
  language: "Verilog"
  clock_hz: 25000000
  tiles: "1x1"
  top_module: "tt_um_hust_apb_uart"
  source_files:
    - "tt_um_hust_apb_uart.v"
    - "apb_regs.v"
    - "apb_uart.v"
    - "avalon2apb.v"
    - "bit_cnt.v"
    - "data_b_num.v"
    - "deframe.v"
    - "error_check.v"
    - "rx_baud_gen.v"
    - "rx_controller.v"
    - "rx_uart.v"
    - "sipo.v"
    - "spi2apb.v"
    - "stop_b_num.v"
    - "tick_cnt.v"
    - "top_uart.v"
    - "tx_baud_gen.v"
    - "tx_bit_cnt.v"
    - "tx_controller.v"
    - "tx_parity.v"
    - "tx_piso.v"
    - "tx_stop_cnt.v"
    - "tx_tick_cnt.v"
    - "tx_uart.v"
pinout:
  ui[0]: "UART RX"
  ui[1]: "UART CTS_N"
  ui[2]: "SPI CS_N"
  ui[3]: "SPI SCLK"
  ui[4]: "SPI MOSI"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"
  uo[0]: "UART TX"
  uo[1]: "UART RTS_N"
  uo[2]: "SPI MISO"
  uo[3]: "UART TX_DONE"
  uo[4]: "UART RX_DONE"
  uo[5]: "UART PARITY_ERR"
  uo[6]: "UART IRQ"
  uo[7]: "Reserved scan_out (constant 0)"
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
yaml_version: 6
