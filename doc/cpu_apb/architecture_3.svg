<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="30" y="45" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="bold" fill="#1b2c47">03 Bridge Avalon viết tay</text>
<text x="30" y="85" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#475569">Phương án có trong repo; chưa được instantiate trong SoC Quartus đã kiểm tra</text>
<polyline points="420,330 650,330" fill="none" stroke="#315fc1" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="535.0" y="320.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#315fc1" stroke="#fff" stroke-width="6" paint-order="stroke">Avalon-MM</text>
<polyline points="1090,330 1320,330" fill="none" stroke="#315fc1" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="1205.0" y="320.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#315fc1" stroke="#fff" stroke-width="6" paint-order="stroke">APB</text>
<rect x="60" y="240" width="360" height="250" rx="10" fill="#e7efff" stroke="#4567a0" stroke-width="2"/>
<text x="240.0" y="306.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">Avalon-MM host</text>
<text x="240.0" y="332.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">read / write / chipselect</text>
<text x="240.0" y="358.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">address[11:0]</text>
<text x="240.0" y="384.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">writedata[31:0]</text>
<text x="240.0" y="410.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">byteenable[3:0]</text>
<text x="240.0" y="436.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">readdata / waitrequest / response</text>
<rect x="650" y="240" width="440" height="250" rx="10" fill="#fff2cc" stroke="#b68b21" stroke-width="2"/>
<text x="870.0" y="306.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">avalon2apb.v</text>
<text x="870.0" y="332.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">Avalon slave + APB master</text>
<text x="870.0" y="358.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">IDLE -&gt; SETUP -&gt; ACCESS</text>
<text x="870.0" y="384.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">waitrequest=1 trong khi cho</text>
<text x="870.0" y="410.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">ACCESS: waitrequest = !PREADY</text>
<text x="870.0" y="436.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">ADDR_MODE 0: byte | 1: word</text>
<rect x="1320" y="240" width="360" height="250" rx="10" fill="#ffe9df" stroke="#b65b37" stroke-width="2"/>
<text x="1500.0" y="306.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">apb_uart</text>
<text x="1500.0" y="332.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">apb_slave -&gt; uart_regs</text>
<text x="1500.0" y="358.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">PADDR / PWDATA / PWRITE</text>
<text x="1500.0" y="384.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">PSEL / PENABLE</text>
<text x="1500.0" y="410.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">PRDATA / PREADY / PSLVERR</text>
<text x="1500.0" y="436.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">FIFO va UART TX/RX</text>
<rect x="60" y="590" width="1620" height="150" rx="10" fill="#fff2cc" stroke="#b68b21" stroke-width="2"/>
<text x="870.0" y="645.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">Bridge dang bo qua avl_byteenable; APB khong co PSTRB. Chi dung MMIO 32-bit aligned cho cac vi du nay.</text>
<text x="870.0" y="671.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">PREADY=1 la xong giao dich thanh ghi, chua phai UART da phat xong 1 frame.</text>
<text x="870.0" y="697.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#17243b">Muon dung trong Platform Designer can dong goi component/tao wrapper va noi interface ro rang.</text>
</svg>